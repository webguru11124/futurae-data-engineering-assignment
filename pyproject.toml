[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-metrics"
version = "0.1.0"
description = "Cleans service events, aggregates per-minute operational metrics and serves them over HTTP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",  # required by fastapi.testclient
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
event-pipeline = "event_metrics.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/event_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
